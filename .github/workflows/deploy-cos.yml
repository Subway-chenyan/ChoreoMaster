name: Deploy web to Tencent COS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cos-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  COS_BUCKET: beat-1317738912
  COS_REGION: ap-guangzhou
  COS_ALIAS: production
  CDN_URL: https://beat.cosdrama.cn/
  INSTALLER_OBJECT: downloads/CosStage-Setup-x64.exe
  INSTALLER_URL: https://beat.cosdrama.cn/downloads/CosStage-Setup-x64.exe
  COSCLI_VERSION: v1.0.8

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:electron

      - name: Prepare stable installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*-Setup-*-x64.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer was not generated.'
          }

          $stableInstaller = Join-Path $installer.DirectoryName 'CosStage-Setup-x64.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $stableInstaller).Hash.ToLowerInvariant()
          "$hash  CosStage-Setup-x64.exe" |
            Set-Content -Encoding ascii -Path 'release/CosStage-Setup-x64.exe.sha256'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/CosStage-Setup-x64.exe
            release/CosStage-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: desktop-release

      - name: Install COSCLI
        run: |
          curl -fsSL \
            "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64" \
            -o /usr/local/bin/coscli
          chmod +x /usr/local/bin/coscli
          coscli --version

      - name: Configure COSCLI
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          : "${TENCENT_SECRET_ID:?Missing GitHub secret TENCENT_SECRET_ID}"
          : "${TENCENT_SECRET_KEY:?Missing GitHub secret TENCENT_SECRET_KEY}"
          coscli config add \
            --init-skip=true \
            -a "${COS_ALIAS}" \
            -b "${COS_BUCKET}" \
            -r "${COS_REGION}" \
            -e "cos.${COS_REGION}.myqcloud.com" \
            -i "${TENCENT_SECRET_ID}" \
            -k "${TENCENT_SECRET_KEY}"

      - name: Upload build to COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          coscli sync ./dist/ "cos://${COS_ALIAS}/" \
            --secret-id "${TENCENT_SECRET_ID}" \
            --secret-key "${TENCENT_SECRET_KEY}" \
            --recursive \
            --force
          coscli cp ./dist/index.html "cos://${COS_ALIAS}/index.html" \
            --secret-id "${TENCENT_SECRET_ID}" \
            --secret-key "${TENCENT_SECRET_KEY}" \
            --meta "Cache-Control:no-cache"

      - name: Upload Windows installer to COS
        timeout-minutes: 75
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          coscli cp ./desktop-release/CosStage-Setup-x64.exe \
            "cos://${COS_ALIAS}/${INSTALLER_OBJECT}" \
            --secret-id "${TENCENT_SECRET_ID}" \
            --secret-key "${TENCENT_SECRET_KEY}" \
            --part-size 4 \
            --thread-num 16 \
            --err-retry-num 10 \
            --err-retry-interval 3 \
            --meta "Cache-Control:public,max-age=3600#Content-Disposition:attachment; filename=CosStage-Setup-x64.exe#Content-Type:application/vnd.microsoft.portable-executable"
          coscli cp ./desktop-release/CosStage-Setup-x64.exe.sha256 \
            "cos://${COS_ALIAS}/${INSTALLER_OBJECT}.sha256" \
            --secret-id "${TENCENT_SECRET_ID}" \
            --secret-key "${TENCENT_SECRET_KEY}" \
            --meta "Cache-Control:no-cache#Content-Type:text/plain"

      - name: Install Tencent Cloud CLI
        run: pip install --disable-pip-version-check tccli

      - name: Refresh Tencent CDN
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          tccli cdn PurgePathCache \
            --secretId "${TENCENT_SECRET_ID}" \
            --secretKey "${TENCENT_SECRET_KEY}" \
            --region "${COS_REGION}" \
            --Paths "[\"${CDN_URL}\"]" \
            --FlushType flush \
            --Area mainland
          tccli cdn PurgeUrlsCache \
            --secretId "${TENCENT_SECRET_ID}" \
            --secretKey "${TENCENT_SECRET_KEY}" \
            --region "${COS_REGION}" \
            --Urls "[\"${INSTALLER_URL}\",\"${INSTALLER_URL}.sha256\"]" \
            --Area mainland

      - name: Verify deployment
        run: |
          expected_asset="$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -n 1)"
          deployed_html=""
          for attempt in $(seq 1 12); do
            deployed_html="$(curl -fsSL "${CDN_URL}?deploy=${GITHUB_SHA}" || true)"
            if grep -Fq "${expected_asset}" <<< "${deployed_html}"; then
              break
            fi
            echo "Waiting for CDN refresh (${attempt}/12)..."
            sleep 5
          done
          grep -F "${expected_asset}" <<< "${deployed_html}"
          curl -fsSI --retry 5 --retry-delay 3 "${CDN_URL}${expected_asset}" > /dev/null
          expected_size="$(stat -c%s ./desktop-release/CosStage-Setup-x64.exe)"
          deployed_size="$(
            curl -fsSI --retry 5 --retry-delay 3 "${INSTALLER_URL}?deploy=${GITHUB_SHA}" |
              tr -d '\r' |
              awk 'tolower($1) == "content-length:" { print $2 }' |
              tail -n 1
          )"
          test "${deployed_size}" = "${expected_size}"
          curl -fsSL --retry 5 --retry-delay 3 "${INSTALLER_URL}.sha256?deploy=${GITHUB_SHA}" |
            grep -Fq 'CosStage-Setup-x64.exe'
