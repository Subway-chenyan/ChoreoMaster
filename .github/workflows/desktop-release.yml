name: Desktop Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect release mode
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! node --input-type=module -e \
            'import { compareSemver } from "./scripts/release/release-model.mjs"; process.exit(compareSemver(process.argv[1], "1.1.0") < 0 ? 1 : 0)' \
            "$version"; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_commit=false
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            version_commit=true
          elif previous_package="$(git show HEAD^:package.json 2>/dev/null)"; then
            previous_version="$(printf '%s' "$previous_package" | node -e 'let source="";process.stdin.on("data",chunk=>source+=chunk).on("end",()=>process.stdout.write(JSON.parse(source).version))')"
            if [ "$previous_version" != "$version" ]; then
              version_commit=true
            fi
          else
            version_commit=true
          fi

          tag="v$version"
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            if [ "$version_commit" != true ]; then
              echo "Unpublished version $version must be released from its version-changing commit." >&2
              exit 1
            fi
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_commit="$(git rev-list -n 1 "$tag")"
          if [ "$version_commit" = true ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Tag $tag does not target current release commit $GITHUB_SHA." >&2
            exit 1
          fi
          tag_version="$(git show "${tag}:package.json" | node -e 'let source="";process.stdin.on("data",chunk=>source+=chunk).on("end",()=>process.stdout.write(JSON.parse(source).version))')"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag $tag does not contain package version $version." >&2
            exit 1
          fi

          release_json="$(mktemp)"
          release_error="$(mktemp)"
          trap 'rm -f -- "$release_json" "$release_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >"$release_json" 2>"$release_error"; then
            if node -e \
              'const fs=require("node:fs");const release=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const names=new Set((release.assets||[]).map(asset=>asset.name));process.exit(process.argv.slice(2).every(name=>names.has(name))?0:1)' \
              "$release_json" \
              "CosStage-Setup-$version-x64.exe" \
              "CosStage-Setup-$version-x64.exe.sha256"; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "mode=repair-release" >> "$GITHUB_OUTPUT"
            fi
          elif grep -Eq 'HTTP 404|Not Found' "$release_error"; then
            echo "mode=repair-release" >> "$GITHUB_OUTPUT"
          else
            cat "$release_error" >&2
            echo "Unable to determine GitHub Release state for $tag." >&2
            exit 1
          fi

  build-windows:
    needs: detect
    if: needs.detect.outputs.mode == 'publish'
    runs-on: windows-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm test

      # Temporary exception: no trusted Authenticode certificate is currently available.
      # Keep this explicit and deterministic until production signing is restored.
      - name: Build explicitly unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          COSSTAGE_REQUIRE_CODE_SIGNING: 'false'
        run: npm run build:electron:win

      - name: Verify explicitly unsigned release artifacts
        shell: pwsh
        run: |
          $version = '${{ needs.detect.outputs.version }}'
          node scripts/release/verify-builder-output.mjs $version
          $signatureArgs = @{
            InstallerPath = "release/CosStage-Setup-$version-x64.exe"
            ExpectedVersion = $version
            AllowUnsigned = $true
          }
          ./scripts/release/verify-windows-signature.ps1 @signatureArgs
          Copy-Item -LiteralPath build/release-notes.md -Destination release/release-notes.md -Force

      - name: Upload signed desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ needs.detect.outputs.version }}
          path: |
            release/CosStage-Setup-${{ needs.detect.outputs.version }}-x64.exe
            release/CosStage-Setup-${{ needs.detect.outputs.version }}-x64.exe.blockmap
            release/CosStage-Setup-${{ needs.detect.outputs.version }}-x64.exe.sha256
            release/CosStage-Setup-x64.exe
            release/latest.yml
            release/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [detect, build-windows]
    if: needs.detect.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      CDN_URL: https://beat.cosdrama.cn/
      INSTALLER_URL: https://beat.cosdrama.cn/downloads/CosStage-Setup-x64.exe
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download signed desktop artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-${{ needs.detect.outputs.version }}
          path: desktop

      - name: Install and configure verified Tencent CLIs
        shell: bash
        run: |
          set -euo pipefail
          : "${TENCENT_SECRET_ID:?Missing GitHub secret TENCENT_SECRET_ID}"
          : "${TENCENT_SECRET_KEY:?Missing GitHub secret TENCENT_SECRET_KEY}"
          coscli_file="$(mktemp)"
          trap 'rm -f -- "$coscli_file"' EXIT
          curl -fsSL --retry 5 --retry-delay 3 \
            "https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64" \
            -o "$coscli_file"
          printf '%s  %s\n' \
            '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91' \
            "$coscli_file" | sha256sum --check --strict
          sudo install -m 0755 "$coscli_file" /usr/local/bin/coscli
          python -m pip install --disable-pip-version-check tccli==3.1.128.1
          coscli config add \
            --init-skip=true \
            -a production \
            -b beat-1317738912 \
            -r ap-guangzhou \
            -e cos.accelerate.myqcloud.com \
            -i "$TENCENT_SECRET_ID" \
            -k "$TENCENT_SECRET_KEY"
          versioning_state="$(coscli bucket-versioning \
            --method get \
            cos://production \
            --secret-id "$TENCENT_SECRET_ID" \
            --secret-key "$TENCENT_SECRET_KEY" 2>&1)"
          if ! grep -Fq 'bucket versioning status is Closed' <<< "$versioning_state"; then
            echo "Immutable release publishing requires COS bucket versioning to be Closed." >&2
            exit 1
          fi

      - name: Download existing release index
        shell: bash
        run: |
          set -euo pipefail
          index_error="$(mktemp)"
          trap 'rm -f -- "$index_error"' EXIT
          if coscli cp cos://production/downloads/releases.json releases.previous.json \
            --secret-id "$TENCENT_SECRET_ID" \
            --secret-key "$TENCENT_SECRET_KEY" \
            2>"$index_error"; then
            test -s releases.previous.json
          elif grep -Eiq 'NoSuchKey|HTTP[^0-9]*404|status[^0-9]*404|not[[:space:]-]+found' "$index_error"; then
            : > releases.previous.json
          else
            cat "$index_error" >&2
            echo "Unable to download existing release index from COS." >&2
            exit 1
          fi

      - name: Publish immutable artifacts and pointers
        shell: bash
        run: bash scripts/release/publish-cos.sh

  repair-release:
    needs: detect
    if: needs.detect.outputs.mode == 'repair-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download and verify immutable release files
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://beat.cosdrama.cn/downloads"
          installer="CosStage-Setup-$VERSION-x64.exe"
          curl -fsSLo "$installer" --retry 5 --retry-delay 3 "$base_url/$installer"
          curl -fsSLo "$installer.sha256" --retry 5 --retry-delay 3 "$base_url/$installer.sha256"
          curl -fsSLo release-notes.md --retry 5 --retry-delay 3 \
            "$base_url/release-notes-$VERSION.md"
          sha256sum --check --strict "$installer.sha256"

      - name: Repair GitHub Release only
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "CosStage-Setup-$VERSION-x64.exe" \
              "CosStage-Setup-$VERSION-x64.exe.sha256" \
              --clobber
            gh release edit "$tag" --title "CosStage $VERSION" --notes-file release-notes.md
          else
            gh release create "$tag" \
              "CosStage-Setup-$VERSION-x64.exe" \
              "CosStage-Setup-$VERSION-x64.exe.sha256" \
              --title "CosStage $VERSION" \
              --notes-file release-notes.md
          fi

  deploy-web:
    needs: [detect, publish, repair-release]
    if: always() && (needs.publish.result == 'success' || needs.repair-release.result == 'success')
    uses: ./.github/workflows/web-deploy.yml
    with:
      force: true
    secrets: inherit
