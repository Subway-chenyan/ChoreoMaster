name: Android preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'components/mobile/**'
      - 'components/Stage.tsx'
      - 'electron/project-document.ts'
      - 'electron/project-contract.ts'
      - 'electron/model-asset-contract.ts'
      - 'utils/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index*'
      - 'package*.json'
      - 'tests/mobile*'
      - 'tests/mobile-ui/**'
      - 'playwright.mobile.config.ts'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck && npm run test:mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile:ui
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm run android:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CosStage-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
