name: Android preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'components/mobile/**'
      - 'components/Stage*.tsx'
      - 'types.ts'
      - 'context/**'
      - 'index.css'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'postcss.config*'
      - 'public/**'
      - 'scripts/android/**'
      - 'data/android-signing.json'
      - 'electron/project-document.ts'
      - 'electron/project-contract.ts'
      - 'electron/model-asset-contract.ts'
      - 'electron/stage-defaults.ts'
      - 'utils/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index*'
      - 'package*.json'
      - 'tests/mobile*'
      - 'tests/mobile-ui/**'
      - 'playwright.mobile.config.ts'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android*.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'components/mobile/**'
      - 'components/Stage*.tsx'
      - 'types.ts'
      - 'context/**'
      - 'index.css'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'postcss.config*'
      - 'public/**'
      - 'scripts/android/**'
      - 'data/android-signing.json'
      - 'electron/project-document.ts'
      - 'electron/project-contract.ts'
      - 'electron/model-asset-contract.ts'
      - 'electron/stage-defaults.ts'
      - 'utils/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index*'
      - 'package*.json'
      - 'tests/mobile*'
      - 'tests/mobile-ui/**'
      - 'playwright.mobile.config.ts'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android*.yml'

permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      channel: preview
  publish-preview:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-preview
          path: android-release
      - run: bash scripts/android/setup-cos.sh
      - run: node scripts/android/publish.mjs
      - name: Record preview URL
        run: |
          node -e 'const m=require("./android-release/manifest.json");require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Preview APK (separate app): " + m.url + "\nSHA256: " + m.sha256 + "\n")'
